<h2>Responses:</h2>
<fieldset>
    <p>
        <label for="composerName">Composer:</label>
        <label id="composerName">{{ responses.composer }}</label>
        <a href="/services/musicians/{{ responses.composer.id }}/" >Composer details</a>
    </p>
    <p>
        <label for="title">Title:</label>
        <label id="title">{{ responses.title }}</label>
    </p>
    <p>
        <label for="knownAs">Known as:</label>
        <label id="knownAs">{{ responses.knownAs }}</label>
    </p>
    <p>
        <label>JSON format:</label>
        {{ responses.as_public_json }}
    </p>
</fieldset>
