{% extends "services/base.html" %}
{% block content %}
    <h2>Future services</h2>
    {% if latest_services %}
    <ul>
        {% for service in latest_services %}
        <li><a href="/services/{{ service.id }}/">{{ service }}</a></li>
        {% endfor %}
    </ul>
    {% else %}
    <p>No services are available.</p>
    {% endif %}
{% endblock %}
